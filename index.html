/* Layout: una columna centrada de 720px. Cabecera con un plato visto desde arriba, tablero 00-99 de azulejos, barra fija abajo para el pedido (o para editar si es la organizadora). */
:root{
  --bg:#FFF7F2; --surface:#FFFFFF; --ink:#39243B; --muted:#806C80; --line:#F0DCE5;
  --accent:#C23D70; --accent-ink:#FFFFFF; --accent-soft:#FBE3ED;
  --hold-bg:#FFF0C2; --hold-ink:#875600; --sold-bg:#E9E4EC; --sold-ink:#74677A;
  --danger:#B3261E;
  --font-display:'Gloock', Georgia, 'Times New Roman', serif;
  --font-body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#21151F; --surface:#30202D; --ink:#FFF4FA; --muted:#C7ADBF; --line:#54364C;
    --accent:#F09AB8; --accent-ink:#21151F; --accent-soft:#4A293D;
    --hold-bg:#3A2B0A; --hold-ink:#FFD78A; --sold-bg:#392B37; --sold-ink:#C4A7BA;
    --danger:#FF9DAB; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#21151F; --surface:#30202D; --ink:#FFF4FA; --muted:#C7ADBF; --line:#54364C;
  --accent:#F09AB8; --accent-ink:#21151F; --accent-soft:#4A293D;
  --hold-bg:#3A2B0A; --hold-ink:#FFD78A; --sold-bg:#392B37; --sold-ink:#C4A7BA;
  --danger:#FF9DAB; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 var(--font-body); -webkit-text-size-adjust:100%;
  padding-block:20px 210px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#app{max-width:720px; margin:0 auto; display:grid; gap:28px}
#app > div:empty{display:none}
h1,h2,h3{font-family:var(--font-display); font-weight:400; margin:0; text-wrap:balance}
h1{font-size:clamp(32px, 8vw, 46px); line-height:1.05}
h2{font-size:25px; line-height:1.15; margin-bottom:6px}
h3{font-size:19px; margin:22px 0 8px}
p{margin:0}
.kicker{font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.premio{font-size:18px; color:var(--muted); margin-top:8px}
.hint,.help{color:var(--muted); font-size:15px}
.help{margin-bottom:12px}

.hero{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.hero-t{flex:1 1 220px; min-width:0}
.plate{width:92px; height:92px; flex:none; max-width:100%}
.p-rim{fill:var(--surface); stroke:var(--accent); stroke-width:3}
.p-dash{fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:1 6; stroke-linecap:round}
.p-well{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5}
.p-petal{fill:var(--accent); opacity:.88}
.p-core{fill:var(--surface); stroke:var(--accent); stroke-width:2}

.chip{
  margin-left:auto; appearance:none; cursor:pointer; min-height:40px;
  padding:8px 16px; border-radius:999px; border:1.5px solid var(--accent);
  background:transparent; color:var(--accent); font:600 14px var(--font-body);
}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

.facts{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin:0; padding:12px 0; border-block:1px solid var(--line)}
.facts div{min-width:0}
.facts dt{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.facts dd{margin:2px 0 0; font:400 22px/1.2 var(--font-display); font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.meter{height:10px; border-radius:999px; background:var(--accent-soft); overflow:hidden; margin-top:14px}
.meter span{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .3s}
.meter-l{font-size:14px; color:var(--muted); margin-top:8px}
.sorteo{margin-top:14px; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; font-size:15px}

.legend{list-style:none; margin:0 0 12px; padding:0; display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--muted)}
.sw{display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:6px; border:1.5px solid var(--line); background:var(--surface)}
.sw.s{background:var(--accent); border-color:var(--accent)}
.sw.r{background:var(--hold-bg); border:1.5px dashed var(--hold-ink)}
.sw.v{background:var(--sold-bg); border-color:transparent}

.grid{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px}
@media (min-width:700px){.grid{grid-template-columns:repeat(10, minmax(0,1fr)); gap:6px}}
.tile{
  appearance:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  width:100%; min-width:0; max-width:100%; aspect-ratio:1 / 1; padding:0; cursor:pointer;
  border:1.5px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink);
  font-family:var(--font-body); transition:background .15s, border-color .15s;
}
.tile .num{font:600 22px/1 var(--font-body); font-variant-numeric:tabular-nums}
.tile .cap{font:600 9px/1 var(--font-body); letter-spacing:.04em; text-transform:uppercase}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile:focus-visible,.edit{outline:3px solid var(--accent); outline-offset:2px}
.tile.sel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.tile[data-s="r"]{background:var(--hold-bg); color:var(--hold-ink); border:1.5px dashed var(--hold-ink)}
.tile[data-s="v"]{background:var(--sold-bg); color:var(--sold-ink); border-color:transparent}
.tile[data-s="v"] .num{text-decoration:line-through; text-decoration-thickness:2px}
.tile:disabled{cursor:not-allowed}

.pago{padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
.pago p:not(.hint){font-size:17px; overflow-wrap:anywhere}

.owner{border-top:2px solid var(--accent); padding-top:20px}
.reg{list-style:none; margin:0 0 12px; padding:0}
.row{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
.rn{font-weight:700; font-variant-numeric:tabular-nums}
.rname{overflow-wrap:anywhere}
.pill{font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px}
.pill.r{background:var(--hold-bg); color:var(--hold-ink)}
.pill.v{background:var(--sold-bg); color:var(--ink)}
.ajustes{margin-top:22px}
.ajustes summary{cursor:pointer; font-weight:600; min-height:32px}
.form{display:grid; gap:14px; margin-top:10px}
.form label{display:block; font-weight:600; font-size:14px; margin-bottom:4px}
input,textarea{
  width:100%; min-width:0; font:16px var(--font-body); color:var(--ink); background:var(--surface);
  border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;
}
textarea{min-height:84px; resize:vertical}
input:focus-visible,textarea:focus-visible,.btn:focus-visible,.ghost:focus-visible,.chip:focus-visible,.seg button:focus-visible,summary:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.regtxt{margin-top:10px; min-height:120px}

.btn,.ghost{
  appearance:none; display:inline-flex; align-items:center; justify-content:center; min-height:44px;
  padding:10px 18px; border-radius:10px; font:700 16px var(--font-body); cursor:pointer; text-decoration:none;
}
.btn{background:var(--accent); color:var(--accent-ink); border:0}
.btn:disabled{opacity:.6; cursor:default}
.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line); font-weight:600; font-size:15px}
.sm{min-height:36px; padding:6px 12px; font-size:14px}

.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-shadow:0 -8px 24px rgba(15,27,61,.10);
}
.bar-in{max-width:720px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 14px}
.sum{min-width:0}
.sub{display:block; font-size:14px; color:var(--muted)}
.btns{display:flex; gap:8px; flex-wrap:wrap}
.bar-in.ed{display:grid; gap:10px}
.ed-h{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px}
.seg{display:inline-flex; border:1.5px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{appearance:none; border:0; background:transparent; color:var(--ink); padding:9px 14px; font:600 14px var(--font-body); cursor:pointer; min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.ed-f{display:flex; flex-wrap:wrap; gap:8px}
.ed-f input{flex:1 1 180px}
.full{flex-basis:100%}
.note{flex-basis:100%; margin:0; color:var(--danger); font-size:14px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style><div id="app"></div><div id="bar" class="bar" hidden></div><script type="application/json" id="rifa-datos">{"premio":"Juego de vajilla de 4 puestos · 16 piezas","precio":10000,"whatsapp":"","pago":"Nequi: 3105311572\nLlave: 3105311571\nDespués de pagar, envía el comprobante con tus números.","sorteo":"","numeros":{}}</script><script id="logica">
(function(){
'use strict';
var SHELL = '<div id="app"></div><div id="bar" class="bar" hidden></div>';
var $ = function(id){ return document.getElementById(id); };

var state;
try { state = JSON.parse($('rifa-datos').textContent); } catch(e) { state = {}; }
state = Object.assign({premio:'Juego de vajillas', precio:10000, whatsapp:'', pago:'', sorteo:'', numeros:{}}, state);
if (!state.numeros) state.numeros = {};
var original = JSON.stringify(state);

var isAdmin = false, adminMode = false, sel = new Set(), ed = null;
var publishing = false, note = '', copied = false, copyFail = '', regTxt = '';
try { adminMode = sessionStorage.getItem('rifa-admin') === '1'; } catch(e) {}

function fmt(n){ return '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function counts(){
  var k = Object.keys(state.numeros);
  var v = k.filter(function(x){ return state.numeros[x].e === 'v'; }).length;
  return {v:v, r:k.length - v, t:k.length, libres:100 - k.length};
}

  var o = JSON.parse(original), n = 0, ks = {};

  Object.keys(ks).forEach(function(k){

  });
  ['premio','precio','whatsapp','pago','sorteo'].forEach(function(f){ if (o[f] !== state[f]) n++; });
  return n;

var PLATE = (function(){
  var petals = '';
  for (var i = 0; i < 8; i++) {
    petals += '<ellipse class="p-petal" cx="60" cy="43" rx="5.5" ry="13" transform="rotate(' + (i * 45) + ' 60 60)"/>';
  }
  return '<svg class="plate" viewBox="0 0 120 120" aria-hidden="true">' +
    '<circle class="p-rim" cx="60" cy="60" r="57"/><circle class="p-dash" cx="60" cy="60" r="50"/>' +
    '<circle class="p-well" cx="60" cy="60" r="38"/>' + petals + '<circle class="p-core" cx="60" cy="60" r="7"/></svg>';
})();

function renderTop(){
  var c = counts();
  var btn = isAdmin ? '<button type="button" class="chip" data-act="admin" aria-pressed="' + adminMode + '">' + (adminMode ? 'Salir de administrar' : 'Administrar') + '</button>' : '';
  $('v-top').innerHTML =
    '<header class="hero">' + PLATE +
    '<div class="hero-t"><p class="kicker">Rifa · 100 números</p><h1>Rifa de la vajilla</h1><p class="premio">' + esc(state.premio) + '</p></div>' + btn + '</header>' +
    '<dl class="facts"><div><dt>Cada número</dt><dd>' + fmt(state.precio) + '</dd></div>' +

    '<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + c.t + '"><span style="width:' + c.t + '%"></span></div>' +
    '<p class="meter-l">' + c.t + ' de 100 números tomados</p>' +

function renderBoard(){
  var help = adminMode
    ? 'Toca un número para marcarlo como reservado o vendido.'
    : 'Toca los números libres que quieras. Tu número queda asegurado cuando se confirma el pago.';
  var tiles = '';
  for (var i = 0; i < 100; i++) {
    var k = pad(i), e = state.numeros[k], s = e ? e.e : 'l';

    '<section><h2>' + (adminMode ? 'Tablero' : 'Elige tus números') + '</h2><p class="help">' + help + '</p>' +
    '<ul class="legend"><li><span class="sw"></span>Libre</li><li><span class="sw s"></span>Elegido</li>' +
    '<li><span class="sw r"></span>Reservado</li><li><span class="sw v"></span>Vendido</li></ul>' +
    '<div class="grid">' + tiles + '</div></section>';

function renderPago(){
  var p = (state.pago || '').trim();
  if (p) {
    $('v-pago').innerHTML = '<section class="pago"><h2>Cómo pagar</h2><p>' + esc(p).replace(/\n/g, '<br>') + '</p></section>';
  } else if (adminMode) {
    $('v-pago').innerHTML = '<section class="pago"><h2>Cómo pagar</h2><p class="hint">Todavía no escribiste cómo pagar. Agrégalo en Ajustes de la rifa y aparecerá aquí.</p></section>';
  } else {
    $('v-pago').innerHTML = '';

function moneyHtml(){
  var c = counts(), p = state.precio;
  return '<div><dt>Vendidos</dt><dd>' + c.v + ' · ' + fmt(c.v * p) + '</dd></div>' +
    '<div><dt>Reservados</dt><dd>' + c.r + ' · ' + fmt(c.r * p) + '</dd></div>' +
    '<div><dt>Total posible</dt><dd>' + fmt(100 * p) + '</dd></div>';

function renderOwner(){
  if (!adminMode) { $('v-owner').innerHTML = ''; return; }
  var keys = Object.keys(state.numeros).sort();
  var rows = keys.map(function(k){
    var e = state.numeros[k];
    return '<li class="row"><span class="rn">' + k + '</span><span class="rname">' + esc(e.n || 'Sin nombre') + '</span>' +
      '<span class="pill ' + e.e + '">' + (e.e === 'v' ? 'Vendido' : 'Reservado') + '</span>' +

  $('v-owner').innerHTML =
    '<section class="owner"><h2>Administrar</h2>' +
    '<dl class="facts" id="money">' + moneyHtml() + '</dl>' +
    '<h3>Registro</h3>' +
    (rows
      ? '<ul class="reg">' + rows + '</ul><button type="button" class="ghost" data-act="copiar-reg">Copiar registro</button>' +
        (regTxt ? '<textarea id="reg-txt" class="regtxt" readonly>' + esc(regTxt) + '</textarea>' : '')
      : '<p class="hint">Aún no hay números reservados ni vendidos. Cuando alguien te escriba, toca su número en el tablero.</p>') +
    '<details class="ajustes"><summary>Ajustes de la rifa</summary><div class="form">' +
    '<div><label for="st-premio">Premio</label><input id="st-premio" data-set="premio" value="' + esc(state.premio) + '"></div>' +

    '<div><label for="st-pago">Cómo pagar</label><textarea id="st-pago" data-set="pago" placeholder="Nequi 300 123 4567 a nombre de…">' + esc(state.pago) + '</textarea></div>' +
    '<div><label for="st-sorteo">Cuándo y cómo se sortea</label><input id="st-sorteo" data-set="sorteo" placeholder="Con las dos últimas cifras de la lotería de… del…" value="' + esc(state.sorteo) + '"></div>' +
    '</div></details></section>';

function renderBar(){
  var bar = $('bar');
  var inp = $('ed-nombre'); if (inp && ed) ed.n = inp.value;
  var n = cambios(), html = '';

      '<div class="btns"><button type="button" class="ghost" data-act="limpiar">Quitar</button>' + action + '</div>' +

  if (copyFail) { var pt = $('pedido-txt'); if (pt) { pt.focus(); pt.select(); } }

function renderAll(){ renderTop(); renderBoard(); renderPago(); renderOwner(); renderBar(); }

function startEdit(k){
  var e = state.numeros[k];
  ed = {k:k, e:e ? e.e : 'r', n:e ? (e.n || '') : ''};
  renderBoard(); renderBar();
}

function aplicar(){
  var inp = $('ed-nombre'); if (inp && ed) ed.n = inp.value;
  if (!ed) return;
  if (ed.e === 'l') delete state.numeros[ed.k];
  else state.numeros[ed.k] = {e:ed.e, n:(ed.n || '').trim()};
  ed = null; note = '';
  renderTop(); renderBoard(); renderOwner(); renderBar();
}

function copyText(text, ok, fail){
  try {
    navigator.clipboard.writeText(text).then(ok, fail);
  } catch(e) { fail(); }
}

function buildDoc(){
  var hs = Array.from(document.head.querySelectorAll('style')).find(function(s){ return /safe-area/.test(s.textContent); });
  var reset = hs ? hs.textContent : '';
  var data = JSON.stringify(state).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    '<title>Rifa de la Vajilla</title><meta name="claude:viewport-fit-sides" content="cover">' + $('fuentes').outerHTML +
    '<style id="estilos">' + $('estilos').textContent + '</style>' + SHELL +
    '<script type="application/json" id="rifa-datos">' + data + '<\/script>' +
    '<script id="logica">' + $('logica').textContent + '<\/script></body></html>';
}

async function publish(){
  if (publishing) return;
  publishing = true; note = ''; renderBar();
  try {
    var art = window.claude && window.claude.use ? await window.claude.use('artifact') : null;
    if (!art) throw {code:'not_granted'};
    try { sessionStorage.setItem('rifa-admin', '1'); } catch(e) {}
    await art.publish(buildDoc());
  } catch(err) {
    publishing = false;
    var c = err && err.code;
    note = c === 'conflict' ? 'La página cambió mientras editabas. Se recargará con la versión más reciente.'
      : (c === 'not_writer' || c === 'not_granted' || c === 'capability_disabled' || c === 'not_declared') ? 'Esta cuenta no puede guardar cambios en la rifa.'
      : c === 'rate_limited' ? 'Publicaste muy seguido. Espera un momento y vuelve a intentar.'
      : 'No se pudo publicar. Intenta de nuevo.';
    renderBar();
  }
}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act, k = b.dataset.n;
  if (a === 'tile') {
    if (adminMode) { startEdit(k); return; }
    if (b.disabled) return;
    if (sel.has(k)) sel.delete(k); else sel.add(k);
    copyFail = ''; copied = false;
    renderBoard(); renderBar();
  } else if (a === 'limpiar') {
    sel.clear(); copyFail = ''; renderBoard(); renderBar();
  } else if (a === 'copiar-pedido') {
    var list = Array.from(sel).sort();
    var msg = 'Hola, quiero ' + (list.length === 1 ? 'el número ' : 'los números ') + list.join(', ') + ' de la rifa de la vajilla (' + fmt(list.length * state.precio) + ').';
    copyText(msg, function(){
      copied = true; copyFail = ''; renderBar();
      setTimeout(function(){ copied = false; renderBar(); }, 1800);
    }, function(){ copyFail = msg; renderBar(); });
  } else if (a === 'admin') {
    adminMode = !adminMode; ed = null; sel.clear(); note = '';
    try { sessionStorage.setItem('rifa-admin', adminMode ? '1' : '0'); } catch(err) {}
    renderAll();
  } else if (a === 'edit') {
    startEdit(k);
  } else if (a === 'estado') {
    var inp = $('ed-nombre'); if (inp && ed) ed.n = inp.value;
    if (ed) { ed.e = b.dataset.v; renderBar(); }
  } else if (a === 'aplicar') {
    aplicar();
  } else if (a === 'cerrar') {
    ed = null; renderBoard(); renderBar();
  } else if (a === 'descartar') {
    state = JSON.parse(original); ed = null; note = ''; renderAll();
  } else if (a === 'publicar') {
    publish();
  } else if (a === 'copiar-reg') {
    var lines = Object.keys(state.numeros).sort().map(function(n){
      var r = state.numeros[n];
      return n + ' — ' + (r.n || 'Sin nombre') + ' — ' + (r.e === 'v' ? 'Vendido' : 'Reservado');
    }).join('\n');
    copyText(lines, function(){ regTxt = ''; b.textContent = 'Copiado'; }, function(){ regTxt = lines; renderOwner(); });
  }
});

document.addEventListener('change', function(e){
  var f = e.target.closest ? e.target.closest('[data-set]') : null; if (!f) return;
  var key = f.dataset.set, v = f.value;
  state[key] = key === 'precio' ? Math.max(0, Math.round(Number(v) || 0)) : v.trim();
  renderTop(); renderPago(); renderBar();
  var m = $('money'); if (m) m.innerHTML = moneyHtml();
});

document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'ed-nombre' && ed) ed.n = e.target.value;
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target && e.target.id === 'ed-nombre') { e.preventDefault(); aplicar(); }
});

async function init(){
  $('app').innerHTML = '<div id="v-top"></div><div id="v-board"></div><div id="v-pago"></div><div id="v-owner"></div>';
  renderAll();
  if (window.claude && window.claude.use) {
    try {
      var u = await window.claude.use('user');
      var art = await window.claude.use('artifact');
      if (u && art) isAdmin = (await u.canEdit()) || (await u.isOwner());
    } catch(e) {}
  }
  if (!isAdmin) adminMode = false;
  renderAll();
}
init();
})();
</script></body></html>
